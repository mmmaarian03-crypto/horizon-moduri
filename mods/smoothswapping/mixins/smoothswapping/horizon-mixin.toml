[mod]
id = "smoothswapping"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "smoothswapping"
source = "runtime.rs"

# A click on the menu (`ClickSlotC2SPacket` being built): what was on its way to that slot stops.
[[injection]]
id = "clicks"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::menu_ops"
helper = "clicks.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "ops", ty = "&[(Option<usize>, i32, horizon_client::menu::Input)]", value = "ops" },
]

# Every tick: a closed screen leaves no frame behind.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The inventory screen begins a frame (`HandledScreen.render`): what changed since the last one.
[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::draw_inventory"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&horizon_client::hud::HudBatch", value = "&*batch" },
]

# An item's model (`DrawContext.drawItem`): a slot with items on their way is drawn as the plan
# says.
[[injection]]
id = "model"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::item_draw::Game<'_>::draw_item_model"
helper = "model.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
]

# The carried stack (`renderFloatingItem`): the items on their way to the cursor, and everything
# that waited for the slots to be done.
[[injection]]
id = "carried"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::draw_carried"
helper = "carried.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# The end of the screen's drawing, for the screens that draw no carried stack.
[[injection]]
id = "end"
kind = "HEAD"
target = "horizon_client::game::titles::Game<'_>::draw_saving_indicator"
helper = "end.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]
