  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# The window's temporary block entity goes away with the screen.
[[injection]]
id = "close"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::close_container"
helper = "close.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Hoppers never touch a window's temporary slots.
[[injection]]
id = "move-in"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::machines::Game<'_>::try_move_in_item"
helper = "move_in.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "view", ty = "&View", value = "view" },
  { name = "stack", ty = "&ItemStack", value = "&stack" },
  { name = "slot", ty = "usize", value = "slot" },
]

[[injection]]
id = "take-one"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::machines::Game<'_>::take_one"
helper = "take_one.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "view", ty = "&View", value = "view" },
  { name = "slot", ty = "usize", value = "slot" },
]

# AE2 block entities (window mirrors) are saved under the block id and never loaded back.
[[injection]]
id = "save-id"
kind = "HEAD"
cancellable = true
target = "horizon_client::save::block_entity_id"
helper = "save_id.rs"
bindings = [
  { name = "e", ty = "&crate::containers::BlockEntity", value = "e" },
  { name = "block", ty = "&str", value = "block" },
]

[[injection]]
id = "save-load"
kind = "HEAD"
cancellable = true
target = "horizon_client::save::decode_block_entity"
helper = "save_load.rs"
bindings = [
  { name = "tag", ty = "&Tag", value = "tag" },
]

# Meteorites with the presses (native worldgen step).
[[injection]]
id = "generate"
kind = "RETURN"
target = "horizon_world::worldgen::generator::GeneratorWorker::decorate"
helper = "generate.rs"
bindings = [
  { name = "value", ty = "Result<DecorateStats, GeneratorError>", value = "$value" },
  { name = "region", ty = "&mut [ProtoChunk; 9]", value = "&mut *region" },
]

