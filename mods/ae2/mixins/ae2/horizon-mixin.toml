# Applied Energistics 2 (forge 15.4.11, stage 1: the item storage network) for Horizon: native mod,
# private use. Needs the native mod `foundry` in the same build (energy in through foundry, items moved
# through foundry's item handlers). Generated by tools/gen_mixins.py.
[mod]
id = "ae2"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

# The rules and the game side (native/horizon.rs + src/lib.rs).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "ae2"
source = "runtime.rs"

# Meteorites (native/worldgen.rs + src/lib.rs, tools/bundle_extra.py).
[[module]]
id = "worldgen"
file = "crates/horizon-world/src/worldgen/generator.rs"
name = "ae2"
source = "worldgen_runtime.rs"

# Right click on an AE2 block (before the block's own use).
[[injection]]
id = "use"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::copper_golems::Game<'_>::use_golem_statue"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32;3]", value = "pos" },
]

# BlockItem.place's last step: a placed AE2 block joins its network.
[[injection]]
id = "placed"
kind = "HEAD"
target = "horizon_client::game::advancements::Game<'_>::trigger_block"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "name", ty = "&str", value = "name" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# Every tick: networks, power, machines, buses, interfaces.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::block_entity_ticks::Game<'_>::tick_block_entities"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Random ticks of the budding certus quartz.
[[injection]]
id = "random"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::tick_blocks"
helper = "random.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The world's AE2 records are written with the world...
[[injection]]
id = "save"
kind = "HEAD"
target = "horizon_client::game::Game<'_>::save_game_metadata"
helper = "save.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ...and forgotten when another world opens.
[[injection]]
id = "open"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::load_world_state"
helper = "open.rs"
bindings = []

# Menu clicks that would touch an AE2 window's slots.
[[injection]]
id = "menu-ops"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::menu_ops"
helper = "menu_ops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "ops", ty = "&[(Option<usize>, i32, horizon_client::menu::Input)]", value = "ops" },
]

# Every mouse press on a screen: the AE2 window's slots, search box, buttons, scrollbar.
[[injection]]
id = "mouse"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::tweaks::Game<'_>::sort_mouse_press"
helper = "mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
]

# The wheel over a terminal scrolls its grid.
[[injection]]
id = "scroll"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::tweaks::Game<'_>::tweak_scroll"
helper = "scroll.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "delta", ty = "f32", value = "delta" },
  { name = "slot", ty = "Option<usize>", value = "slot" },
]

# No mouse-tweak drag over an AE2 window.
[[injection]]
id = "drag"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::tweaks::Game<'_>::tweak_drag_move"
helper = "drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The terminal's search box: typing goes the anvil rename box's way.
[[injection]]
id = "typing"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::Game<'_>::station_typing"
helper = "typing.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "key"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::Game<'_>::station_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

[[injection]]
id = "text"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::Game<'_>::station_text"
helper = "text.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "text", ty = "Option<&str>", value = "text" },
  { name = "backspace", ty = "bool", value = "backspace" },
]

# The window's geometry and drawing (ironchest's and foundry's screen hooks).
[[injection]]
id = "height"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::machines::Game<'_>::screen_height"
helper = "height.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

[[injection]]
id = "slot-position"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::machines::Game<'_>::machine_slot_position"
helper = "slot_position.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "i", ty = "usize", value = "i" },
