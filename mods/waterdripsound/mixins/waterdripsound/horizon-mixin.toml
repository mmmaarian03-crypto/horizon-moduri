[mod]
id = "waterdripsound"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

# The game's side: the landed drips' sounds and the settings page.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "waterdripsound"
source = "runtime.rs"

# The particle engine's side: marks the falling water / lava drips (written by hand, no engine inside).
[[module]]
id = "particles"
file = "crates/horizon-client/src/particles.rs"
name = "waterdripsound_particles"
source = "particles.rs"
visibility = "pub"

# render_tick: `self.particles.tick(&level); self.tick_pickups();` then the particles' sounds are played.
[[injection]]
id = "after"
kind = "HEAD"
target = "horizon_client::game::pickups::Game<'_>::tick_pickups"
helper = "after.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Options > Mods lists the mod.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Its buttons: enable, volume, category (the original's Cloth screen).
[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
