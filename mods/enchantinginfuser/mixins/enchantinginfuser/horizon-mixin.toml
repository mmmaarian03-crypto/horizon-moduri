[[injection]]
id = "lan-open"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::lan_open_container"
helper = "lan_open.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut crate::game::lan::LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "pos", ty = "(i32, i32, i32)", value = "pos" },
]

