[mod]
id = "enchantinginfuser"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

# The rules and the game side (native/horizon.rs + src/lib.rs). Uses forja (its guest menus): verify with
# `tools/hnmod.py forja enchantinginfuser`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "enchantinginfuser"
source = "runtime.rs"

# The library's side (`horizon_client::enchantinginfuser`): which states are infusers.
[[module]]
id = "shared"
file = "crates/horizon-client/src/lib.rs"
name = "enchantinginfuser"
source = "shared.rs"
visibility = "pub"

# BlockItem.place's last step: the infuser's one slot and the item's name on it.
[[injection]]
id = "placed"
kind = "HEAD"
target = "horizon_client::game::advancements::Game<'_>::trigger_block"
helper = "placed.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "name", ty = "&str", value = "name" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
]

# InfuserBlock.use: open_menu reaches open_station for a block the game's block entities do not know.
[[injection]]
id = "open"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::stations::Game<'_>::open_station"
helper = "open.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "name", ty = "&str", value = "name" },
]

