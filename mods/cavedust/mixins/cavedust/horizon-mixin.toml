[mod]
id = "cavedust"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "cavedust"
source = "runtime.rs"

# Every game tick (the window's, not a server's own): dust in the dark air around the player.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
