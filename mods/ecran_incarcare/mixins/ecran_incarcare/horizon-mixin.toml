[mod]
id = "ecran_incarcare"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

# The screen's drawing (layout, text, logo) and the adapter `Loading::ecran_incarcare_draw`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "ecran_incarcare"
source = "runtime.rs"

# The content build's counters, read by the screen: horizon_mods::ecran_incarcare (shared.rs).
[[module]]
id = "shared"
file = "crates/horizon-mods/src/content.rs"
name = "ecran_incarcare"
source = "shared.rs"
visibility = "pub"

# The loading screen: while the UI bundle (the atlas) does not exist, the game drew only black.
# HEAD cancellable: once the atlas (gui) exists, nothing is touched and the vanilla drawing runs.
[[injection]]
id = "draw"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::startup_menu::Loading::draw_menu"
helper = "draw.rs"
bindings = [
  { name = "this", ty = "&mut crate::game::Loading", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# `stamp` passes once over every content mod, before the build: the totals of mods and files.
[[injection]]
id = "source"
kind = "HEAD"
target = "horizon_mods::content::Content::source"
helper = "source.rs"
bindings = [{ name = "this", ty = "&Content", value = "self" }]

# `build` reads the mods one by one: the current one and how many have started.
[[injection]]
id = "reader"
kind = "HEAD"
target = "horizon_mods::content::Content::reader"
helper = "reader.rs"
bindings = [{ name = "this", ty = "&Content", value = "self" }]

# Every game table rewritten (on parallel threads): the progress of the first half.
[[injection]]
id = "write"
kind = "HEAD"
target = "horizon_client::mod_content::Overlay<'_>::write"
helper = "write.rs"
bindings = [
  { name = "this", ty = "&Overlay<'_>", value = "self" },
  { name = "rel", ty = "&str", value = "rel" },
]
