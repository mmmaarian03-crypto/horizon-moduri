[mod]
id = "travelerstitles"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "142388e1c136e622652ec7505af15d8ad195e041"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "travelerstitles"
source = "runtime.rs"

# Options > Mods lists the mod (and turns it off).
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Minecraft.tick HEAD + LocalPlayer.tick TAIL: the renderers tick, the player's biome and dimension are looked at.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# ForgeGui.render HEAD: the titles are drawn at the start of the HUD. The boss bars are the first thing the HUD
# draws after the hotbar (the one hook before the health, food and experience bars).
[[injection]]
id = "draw"
kind = "HEAD"
target = "horizon_client::game::dragon::Game<'_>::draw_boss_bars"
helper = "draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# /biometitle, /dimensiontitle and /tt_reload (permission level 2): a command typed in chat, before the game's own.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
